name: Pages (sample statis)

# Sample statis kelima template di GitHub Pages: https://<owner>.github.io/<repo>/<template>/
# Dibangun oleh scripts/demo/build.mjs (lihat demo/README.md). Deploy HANYA dari main; branch lain/PR hanya
# membangun + memverifikasi (build, verify statis, e2e) tanpa mempublikasikan.
#
# Dua mode publikasi (pilih salah satu):
#  A) Pages dari repo INI. Aktif otomatis bila repo public (atau variabel DEMO_PAGES_SAME_REPO=true). Prasyarat: Settings → Pages → Source: GitHub Actions, dan repo harus public atau
#     memakai plan yang mengizinkan Pages untuk repo privat (Pro/Team).
#  B) Repo publik TERPISAH (disarankan bila repo ini privat/berisi source yang dijual): isi variabel repo
#     DEMO_PUBLISH_REPO=<owner>/<repo-publik> dan secret DEMO_PUBLISH_TOKEN (fine-grained PAT, hanya repo itu,
#     izin Contents: read/write). Hanya HASIL STATIS yang didorong ke repo publik; Pages repo itu: deploy dari
#     branch default (root). Base path otomatis = /<repo-publik>.
on:
  push:
    branches: [main, "claude/**"]
    paths:
      - "demo/**"
      - "scripts/demo/**"
      - "apps/**"
      - "packages/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/pages.yml"
  pull_request:
    paths:
      - "demo/**"
      - "scripts/demo/**"
      - "apps/**"
      - "packages/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:
  schedule:
    # Harian: data seed (agenda sekolah, dsb.) bertanggal relatif waktu build → rebuild menjaganya tetap segar.
    - cron: "17 19 * * *"

permissions:
  contents: read

jobs:
  build:
    # Run terjadwal hanya berguna bila publikasi sudah dikonfigurasi (mode A atau B); selain itu dilewati.
    if: github.event_name != 'schedule' || vars.DEMO_PUBLISH_REPO != '' || (vars.DEMO_PAGES_SAME_REPO == 'true' || github.event.repository.private == false)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      # Opsional (Settings → Variables): tautan "Pesan versi lengkap" di banner demo, mis. https://wa.me/62…
      DEMO_CONTACT_URL: ${{ vars.DEMO_CONTACT_URL }}
      DEMO_CONTACT_LABEL: ${{ vars.DEMO_CONTACT_LABEL }}
      DEMO_PUBLISH_REPO: ${{ vars.DEMO_PUBLISH_REPO }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run test:demo
      # Project site: https://<owner>.github.io/<repo>/ → base path = /<repo>. Repo = repo publik (mode B) atau repo ini.
      - name: Atur origin & base path dari nama repo tujuan
        run: |
          TARGET="${DEMO_PUBLISH_REPO:-$GITHUB_REPOSITORY}"
          OWNER="${TARGET%%/*}"
          echo "DEMO_ORIGIN=https://${OWNER,,}.github.io" >> "$GITHUB_ENV"
          echo "DEMO_BASE_ROOT=/${TARGET#*/}" >> "$GITHUB_ENV"
      - run: npm run demo:build -- all
      - run: npm run demo:verify
      - run: npx playwright install --with-deps chromium
      - run: npm run demo:e2e
      - uses: actions/upload-pages-artifact@v4
        if: github.ref_name == github.event.repository.default_branch && github.event_name != 'pull_request' && vars.DEMO_PUBLISH_REPO == '' && (vars.DEMO_PAGES_SAME_REPO == 'true' || github.event.repository.private == false)
        with:
          path: dist-demo
      - uses: actions/upload-artifact@v4
        if: github.ref_name == github.event.repository.default_branch && github.event_name != 'pull_request' && vars.DEMO_PUBLISH_REPO != ''
        with:
          name: dist-demo
          path: dist-demo
          include-hidden-files: true # .nojekyll
          if-no-files-found: error

  # Mode A: Pages dari repo ini.
  deploy:
    needs: build
    if: github.ref_name == github.event.repository.default_branch && github.event_name != 'pull_request' && vars.DEMO_PUBLISH_REPO == '' && (vars.DEMO_PAGES_SAME_REPO == 'true' || github.event.repository.private == false)
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # Mode B: dorong HASIL STATIS ke repo publik terpisah (source versi lengkap tetap privat).
  publish:
    needs: build
    if: github.ref_name == github.event.repository.default_branch && github.event_name != 'pull_request' && vars.DEMO_PUBLISH_REPO != ''
    runs-on: ubuntu-latest
    concurrency:
      group: pages-publish
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist-demo
          path: dist-demo
      - uses: actions/checkout@v5
        with:
          repository: ${{ vars.DEMO_PUBLISH_REPO }}
          token: ${{ secrets.DEMO_PUBLISH_TOKEN }}
          path: publik
      - name: Salin hasil build ke repo publik lalu push
        working-directory: publik
        run: |
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a "$GITHUB_WORKSPACE/dist-demo/." .
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Tidak ada perubahan untuk dipublikasikan."
          else
            git commit -m "Sample statis dari ${GITHUB_REPOSITORY}@${GITHUB_SHA::7}"
            git push
          fi
