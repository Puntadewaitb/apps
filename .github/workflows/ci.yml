name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Cek repo-wide: lint, typecheck, unit test (packages + app), format, smoke Playwright config.
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:demo
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e -w @tpl/config

  # Satu job per app. App yang belum ada (belum punya package.json) di-skip otomatis.
  app:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        app: [landing-page, company-profile, undangan, sekolah, toko-online]
    env:
      APP_DIR: apps/${{ matrix.app }}
    steps:
      - uses: actions/checkout@v5
      - name: Cek keberadaan app
        id: exists
        run: |
          if [ -f "$APP_DIR/package.json" ]; then echo "present=true" >> "$GITHUB_OUTPUT"; else echo "present=false" >> "$GITHUB_OUTPUT"; echo "::notice::$APP_DIR belum ada, dilewati"; fi
      - uses: actions/setup-node@v5
        if: steps.exists.outputs.present == 'true'
        with:
          node-version-file: .nvmrc
          cache: npm
      - if: steps.exists.outputs.present == 'true'
        run: npm ci
      - if: steps.exists.outputs.present == 'true'
        run: npm run lint
      - if: steps.exists.outputs.present == 'true'
        run: npm run typecheck --workspace "$APP_DIR" --if-present
      - if: steps.exists.outputs.present == 'true'
        run: npm run build --workspace "$APP_DIR"
      - if: steps.exists.outputs.present == 'true'
        run: npx playwright install --with-deps chromium
      - if: steps.exists.outputs.present == 'true'
        run: npm run test:e2e --workspace "$APP_DIR" --if-present
